# DigitalOcean App Platform — Margins 365
# Web Service required so /api/auth/send-verification can call Amazon SES.
# Set SECRET values in the DO control panel or Apps API — do not commit secrets.
# Source must be BA64592/Margins365 (repo renamed from MarginOS) — keep DO App Spec in sync.
name: marginos
region: lon
services:
  - name: marginos
    github:
      repo: BA64592/Margins365
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    # Add SECRET envs in the DO UI / Apps API (never commit values):
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    envs:
      - key: AWS_REGION
        scope: RUN_TIME
        type: GENERAL
        value: eu-north-1
      - key: AWS_SES_REGION
        scope: RUN_TIME
        type: GENERAL
        value: eu-north-1
      - key: SES_FROM_EMAIL
        scope: RUN_TIME
        type: GENERAL
        value: noreply@marginos.online
      - key: SES_FROM_ADDRESS
        scope: RUN_TIME
        type: GENERAL
        value: noreply@marginos.online
      - key: VITE_AUTH_MODE
        scope: BUILD_TIME
        type: GENERAL
        value: strict
domains:
  - domain: margins365.com
    type: PRIMARY
  - domain: www.margins365.com
    type: ALIAS
  - domain: marginos.online
    type: ALIAS
